[force_move]
enable_force_move: True

[AFC_extruder extruder]
pin_tool_start: buffer #!nhk:PA15
#pin_tool_end: None
tool_stn: 30                   # Distance in mm from the toolhead sensor to the tip of the nozzle in mm, if `tool_end` is defined then distance is from this sensor
tool_stn_unload: 80            # Distance to move in mm while unloading toolhead
tool_sensor_after_extruder: 0   # Extra distance to move in mm once pre/post sensors are clear. Useful for when only using post sensor, so this distance can be the amout to move to clear extruder gears
tool_unload_speed: 25           # Unload speed in mm/s when unloading toolhead. Default is 25mm/s.
tool_load_speed: 25             # Load speed in mm/s when unloading toolhead. Default is 25mm/s.

#[filament_switch_sensor bypass]
#switch_pin: turtleneck:PB5
#pause_on_runout: False

[AFC_buffer Turtle_1]
type: FPS_PSF
adc_pin: Turtle_1:PSF
neutral_point: 0.5
max_tension: 0.15
max_compression: 0.85
reversed: true  #Test slide by hand and look at buffer state in mainsail/fluidd Set to true if display shows opposite of your tested state.
#homing_high_point: 0.7
multiplier_high: 1.25
#    Default: 1.15
#    Maximum rotation distance multiplier applied as the buffer nears
#    low_point, speeds up feed to catch up.
multiplier_low: 0.75
#    Default: 0.85
#    Minimum rotation distance multiplier applied as the buffer nears
#    high_point, slows down feed to compensate.

