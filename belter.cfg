[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_150023000650505539323520-if00
restart_method: command


[manual_stepper my_stepper]
step_pin: EBB:PB14
dir_pin: !EBB:PA8
enable_pin: !EBB:PB6
rotation_distance: 60
microsteps: 16


[tmc2209 manual_stepper my_stepper]
uart_pin: EBB:PB3
run_current: 0.55
hold_current: 0.4
stealthchop_threshold: 0
sense_resistor: 0.11

[controller_fan belter_fan]
pin: EBB:PA5
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
# Run whenever this stepper driver is enabled
stepper: manual_stepper my_stepper
# Keep fan running briefly after disable
idle_timeout: 30
heater:



#####################################################################
# BELTER - belt-driven purge ("pooper") macro for AFC / MMU
#
# Each poop:
#   1. Start the slow belt move (runs at the same time as extrusion)
#   2. Purge in segments, with a scrub burst between segments
#      (scrub = fast retract + slower unretract, Blobifier-style)
#   3. Retract at the end of the poop
#   4. Wait for the belt, cool for 1s, then fast-eject the poop
#
# Belt travel per poop is calculated from purge_per_poop using a
# fixed ratio (132mm belt : 120mm filament), so poop shape and
# volume per mm of belt stay the same at any purge length.
# The eject move is fixed and does not scale.
#####################################################################
[gcode_macro belter]
# --- Poop settings ---
variable_poops: 2                     # Number of poops per purge
variable_purge_per_poop: 150          # Total mm of filament per poop (belt scales automatically)
variable_belt_purge_speed: 7          # mm/s belt speed while purging
variable_belt_eject: 120              # mm of fast belt travel to eject (fixed, does not scale)
variable_belt_eject_speed: 200        # mm/s eject speed
variable_purge_feed: 500              # mm/min extrusion speed
# --- Scrub settings ---
variable_scrub_interval: 30           # mm of purge between scrub points
variable_scrub_count: 3               # Scrub cycles per scrub point (clamped to 1-3)
variable_scrub_extrude: 4           # mm extruded between cycles within a burst
variable_scrub_length: 3              # mm retract/unretract per scrub cycle
variable_scrub_retract_speed: 2500    # mm/min, fast pull out of the melt zone
variable_scrub_deretract_speed: 800   # mm/min, slower push back in to re-melt
gcode:
    # --- Locked belt:filament ratio (tuned reference: 132mm belt per 120mm filament) ---
    # Do not change unless re-tuning poop shape
    {% set belt_ratio = 132 / 120 %}
    {% set belt_per_poop = purge_per_poop * belt_ratio %}
    # --- Setup: enable belt, move to purge position, fan on, relative E ---
    MANUAL_STEPPER STEPPER=my_stepper ENABLE=1
    G90
    G1 X-30 Y-29 F10000
    M106 S255
    M83
    # --- Work out segment sizes ---
    # segments: number of purge chunks per poop (scrub between each)
    # scrubs: scrub_count clamped to 1-3 to avoid clogs
    # burst_extra: filament used by in-burst extrudes, taken out of the
    #   main segments so the total per poop stays at purge_per_poop
    {% set segments = (purge_per_poop / scrub_interval)|round(0, 'ceil')|int %}
    {% set scrubs = [[scrub_count|int, 1]|max, 3]|min %}
    {% set burst_extra = (segments - 1) * (scrubs - 1) * scrub_extrude %}
    {% set seg_len = (purge_per_poop - burst_extra) / segments %}
    RESPOND MSG="belter: {poops} x {purge_per_poop}mm, belt {belt_per_poop|round(1)}mm per poop"
    # --- Poop loop ---
    {% for poop in range(poops) %}
        # 2mm end retract on the first poop, 1mm on the rest
        {% set end_retract = 2 if poop == 0 else 1 %}
        RESPOND MSG="belter: poop {poop + 1} of {poops}"
        # Start the slow belt; SYNC=0 lets it run alongside the extrusion
        MANUAL_STEPPER STEPPER=my_stepper SET_POSITION=0
        MANUAL_STEPPER STEPPER=my_stepper MOVE={belt_per_poop} SPEED={belt_purge_speed} SYNC=0
        # Purge in segments, with a scrub burst between segments
        {% for seg in range(segments) %}
            G1 E{seg_len} F{purge_feed}
            {% if not loop.last %}
                # Scrub burst: retract/unretract cycles, with a small
                # extrude between cycles so each pull uses fresh melt
                {% for s in range(scrubs) %}
                    G1 E-{scrub_length} F{scrub_retract_speed}
                    G1 E{scrub_length} F{scrub_deretract_speed}
                    {% if not loop.last %}
                        G1 E{scrub_extrude} F{purge_feed}
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endfor %}
        # End-of-poop retract
        G1 E-{end_retract} F{purge_feed}
        # Wait for the slow belt to finish, then let the poop cool
        MANUAL_STEPPER STEPPER=my_stepper WAIT=1
        G4 P1000
        # Fast belt move to eject the poop (fixed length)
        MANUAL_STEPPER STEPPER=my_stepper SET_POSITION=0
        MANUAL_STEPPER STEPPER=my_stepper MOVE={belt_eject} SPEED={belt_eject_speed}
    {% endfor %}
    # --- Cleanup: fan off, release belt stepper, wipe nozzle ---
    M107
    MANUAL_STEPPER STEPPER=my_stepper ENABLE=0
    AFC_BRUSH